name: Publish research pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check edition replacement and archive preservation
        run: |
          python tools/test_revisions.py
          python tools/test_cloud_worker.py
          python tools/test_claude_cloud_batch.py
          python tools/test_reset_planner.py
      - name: Build from committed selected evidence
        run: python tools/build.py
      - name: Check public data and links
        run: |
          python tools/verify.py
          python tools/test_reader.py
      - name: Adapt links to the project subpath
        run: python tools/pages_mirror.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/pages
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
